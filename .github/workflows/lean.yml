name: Lean CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate carry certificates
        run: |
          python3 scripts/generate_carry_certificates.py
          git diff --exit-code -- \
            A277223/CarryObstruction/EightData.lean \
            A277223/CarryObstruction/Eight.lean \
            A277223/CarryObstruction/TenData.lean \
            A277223/CarryObstruction/Ten.lean

      - name: Arithmetic and family checks
        run: |
          python3 scripts/arithmetic_audit.py
          python3 scripts/infinite_family_audit.py

      - name: Static Lean source check
        run: python3 scripts/static_lean_audit.py

      - name: Reject placeholders and custom axioms
        run: |
          if grep -R -n -E '(^|[^A-Za-z])(sorry|admit|axiom)([^A-Za-z]|$)' A277223 --include='*.lean'; then
            echo 'Forbidden proof placeholder/custom axiom found.'
            exit 1
          fi

      - name: Confirm pinned toolchain
        run: |
          grep -Fx 'leanprover/lean4:v4.32.2' lean-toolchain
          grep -F 'rev = "v4.32.2"' lakefile.toml

      - name: Install elan
        run: |
          curl -L https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch dependencies and Mathlib cache
        run: lake exe cache get

      # These modules have the highest peak elaboration memory. Building them
      # sequentially changes only scheduling; Lake reuses the checked artifacts
      # in the final whole-project build below.
      - name: Prebuild memory-intensive modules sequentially
        run: |
          lake build A277223.CarryObstruction.Eight
          lake build A277223.CarryObstruction.Ten
          lake build A277223.PeriodicCrossing.SevenFamily
          lake build A277223.PeriodicCrossing.ElevenFamily

      - name: Full Lean build and leanchecker recheck
        uses: leanprover/lean-action@v1
        with:
          build: true
          use-mathlib-cache: true
          use-github-cache: false
          leanchecker: true
